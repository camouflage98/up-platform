<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Studio</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23e8a838'/><path d='M12 9l12 7-12 7z' fill='%23151517'/></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><path d="M12 9l12 7-12 7z" fill="#151517"/></svg>
    <span>Video Studio</span>
  </div>

  <label class="field inline">
    <span class="sr-only">Project</span>
    <select id="projectSelect" title="Open a project"></select>
  </label>
  <button class="btn ghost" id="newProject" title="Create a new project">New</button>

  <input id="projectName" class="name-input" aria-label="Project name" placeholder="Untitled">

  <span class="save-state" id="saveState">Saved</span>

  <div class="spacer"></div>

  <button class="btn ghost" id="openSettings" title="Canvas size, frame rate, subtitle style">Settings</button>
  <button class="btn primary" id="openExport">Export video</button>
</header>

<main class="workspace">

  <!-- ───────────────────────── media bin ───────────────────────── -->
  <section class="panel media-panel" id="mediaPanel" aria-label="Media">
    <div class="panel-head">
      <h2>Media</h2>
      <button class="btn tiny" id="addFiles">Add files</button>
      <input type="file" id="fileInput" multiple accept="image/*,video/*,audio/*" hidden>
    </div>
    <div class="media-list" id="mediaList" aria-live="polite"></div>
    <p class="hint" id="mediaHint">
      Drop images, video or audio here — or anywhere on the timeline.
    </p>
  </section>

  <!-- ───────────────────────── preview ───────────────────────── -->
  <section class="panel stage-panel" aria-label="Preview">
    <div class="stage" id="stage">
      <canvas id="preview" width="1920" height="1080"></canvas>
    </div>
    <div class="transport">
      <button class="btn icon" id="toStart" title="Go to start (Home)" aria-label="Go to start">⏮</button>
      <button class="btn icon play" id="playPause" title="Play / pause (Space)" aria-label="Play">▶</button>
      <button class="btn icon" id="toEnd" title="Go to end (End)" aria-label="Go to end">⏭</button>
      <span class="timecode"><strong id="currentTime">00:00.0</strong> / <span id="totalTime">00:00.0</span></span>
      <div class="spacer"></div>
      <label class="field inline zoom">
        <span>Zoom</span>
        <input type="range" id="timelineZoom" min="12" max="400" step="1" value="80">
      </label>
    </div>
  </section>

  <!-- ───────────────────────── inspector ───────────────────────── -->
  <aside class="panel inspector" id="inspector" aria-label="Properties"></aside>
</main>

<!-- ───────────────────────── timeline ───────────────────────── -->
<section class="timeline-wrap" id="timelineWrap" aria-label="Timeline">
  <div class="timeline-tools">
    <button class="btn tiny" id="addSubtitle" title="Add a subtitle at the playhead">+ Subtitle</button>
    <button class="btn tiny" id="addTitleCard" title="Add a plain colour card at the playhead">+ Title card</button>
    <button class="btn tiny" id="splitClip" title="Split the clip under the playhead (S)">Split</button>
    <button class="btn tiny danger" id="deleteSelected" title="Delete selection (Delete)">Delete</button>
    <div class="spacer"></div>
    <label class="check"><input type="checkbox" id="snapToggle" checked> Snap</label>
  </div>

  <div class="timeline-scroll" id="timelineScroll">
    <div class="timeline" id="timeline">
      <div class="ruler" id="ruler"></div>

      <div class="track-row">
        <div class="track-label">Video</div>
        <div class="track lane" id="videoTrack" data-track="video"></div>
      </div>

      <div class="track-row">
        <div class="track-label">Subtitles</div>
        <div class="track lane" id="subtitleTrack" data-track="subtitle"></div>
      </div>

      <div class="track-row">
        <div class="track-label">Audio</div>
        <div class="track lane" id="audioTrack" data-track="audio"></div>
      </div>

      <div class="playhead" id="playhead"><div class="playhead-grip"></div></div>
    </div>
  </div>
</section>

<!-- ───────────────────────── dialogs ───────────────────────── -->
<dialog id="exportDialog" class="dialog">
  <form method="dialog" class="dialog-body" id="exportForm">
    <h2>Export video</h2>

    <label class="field">
      <span>Format</span>
      <select id="exportFormat">
        <option value="mp4">MP4 — H.264, plays everywhere</option>
        <option value="avi">AVI — MPEG-4, for older software</option>
      </select>
    </label>

    <label class="field">
      <span>Quality</span>
      <select id="exportQuality">
        <option value="draft">Draft — fastest, for checking timing</option>
        <option value="good" selected>Good — the usual choice</option>
        <option value="best">Best — slowest, largest file</option>
      </select>
    </label>

    <p class="dialog-note" id="exportSummary"></p>

    <div class="progress" id="exportProgress" hidden>
      <div class="progress-bar"><div class="progress-fill" id="exportFill"></div></div>
      <p class="progress-text" id="exportMessage">Starting…</p>
    </div>

    <p class="error" id="exportError" hidden></p>

    <div class="dialog-actions">
      <button class="btn ghost" value="cancel" id="exportClose">Close</button>
      <button class="btn primary" id="exportStart" type="button">Render</button>
    </div>

    <div id="exportResult" hidden class="export-result">
      <p>✓ <strong id="exportResultName"></strong> <span id="exportResultSize" class="muted"></span></p>
      <a class="btn" id="exportDownload" download>Download</a>
      <span class="muted small">Also saved in <code>video-studio/exports/</code></span>
    </div>
  </form>
</dialog>

<dialog id="settingsDialog" class="dialog">
  <form method="dialog" class="dialog-body" id="settingsForm">
    <h2>Project settings</h2>

    <div class="grid-2">
      <label class="field">
        <span>Canvas</span>
        <select id="setPreset">
          <option value="1920x1080">1920 × 1080 — landscape</option>
          <option value="1080x1920">1080 × 1920 — vertical / reels</option>
          <option value="1080x1080">1080 × 1080 — square</option>
          <option value="1280x720">1280 × 720 — small landscape</option>
          <option value="custom">Custom…</option>
        </select>
      </label>
      <label class="field">
        <span>Frame rate</span>
        <select id="setFps">
          <option value="24">24 fps</option>
          <option value="25">25 fps</option>
          <option value="30" selected>30 fps</option>
          <option value="60">60 fps</option>
        </select>
      </label>
      <label class="field"><span>Width</span><input type="number" id="setWidth" min="16" max="7680" step="2"></label>
      <label class="field"><span>Height</span><input type="number" id="setHeight" min="16" max="4320" step="2"></label>
      <label class="field"><span>Background</span><input type="color" id="setBackground"></label>
    </div>

    <h3>Subtitle style</h3>
    <div class="grid-2">
      <label class="field"><span>Size</span><input type="number" id="stFontSize" min="8" max="400"></label>
      <label class="field"><span>Font</span><input type="text" id="stFontFamily" placeholder="DejaVu Sans"></label>
      <label class="field"><span>Text colour</span><input type="color" id="stColor"></label>
      <label class="field"><span>Outline</span><input type="color" id="stOutlineColor"></label>
      <label class="field"><span>Outline width</span><input type="number" id="stOutlineWidth" min="0" max="20" step="0.5"></label>
      <label class="field"><span>Position</span>
        <select id="stAlign">
          <option value="bottom">Bottom</option>
          <option value="middle">Middle</option>
          <option value="top">Top</option>
        </select>
      </label>
      <label class="field"><span>Edge margin</span><input type="number" id="stMarginV" min="0" max="2000"></label>
      <label class="field"><span>Bold</span><input type="checkbox" id="stBold"></label>
      <label class="field"><span>Box behind text</span><input type="checkbox" id="stBoxOn"></label>
      <label class="field"><span>Box colour</span><input type="color" id="stBoxColor"></label>
    </div>

    <div class="dialog-actions">
      <button class="btn primary" value="close">Done</button>
    </div>
  </form>
</dialog>

<div class="toast-stack" id="toasts" aria-live="polite"></div>

<div class="drop-veil" id="dropVeil" hidden><span>Drop files to add them</span></div>

<script type="module" src="/app.js"></script>
</body>
</html>
